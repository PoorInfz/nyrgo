[package]
name = "nyrgo-token"
version = "0.1.0"
edition = "2021"
description = "NYRGO, the nyrGo! game token (NEP-141, testnet). Fixed supply, created once."
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
