name: Production check

# Run by hand: checks that the website, the app and the API answer as expected, and reports each
# result as an annotation. Read-only; needs no secrets.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check
        run: |
          fail=0
          check() { # name, command
            if out=$(eval "$2" 2>&1); then echo "::notice title=$1::OK ${out:0:300}"
            else echo "::error title=$1::FAILED ${out:0:300}"; fail=1; fi
          }
          check "website"       "curl -fsS https://nyrgo.fun/ | grep -o '<title>[^<]*'"
          check "website www"   "curl -fsS https://www.nyrgo.fun/ | grep -o '<title>[^<]*'"
          check "website play"  "curl -fsS https://nyrgo.fun/ | grep -o 'href=\"https://app.nyrgo.fun\"' | head -1"
          check "website play es" "curl -fsS https://nyrgo.fun/es/ | grep -o 'href=\"https://app.nyrgo.fun/?lang=es\"' | head -1"
          check "website world" "curl -fsS https://nyrgo.fun/es/ | grep -o 'Disponible en todo el mundo'"
          check "website es"    "curl -fsS https://nyrgo.fun/es/ | grep -o '<title>[^<]*'"
          check "app"           "curl -fsS https://app.nyrgo.fun/ | grep -o '<title>[^<]*'"
          check "app route"     "curl -fsS -o /dev/null -w '%{http_code}' https://app.nyrgo.fun/auth/verify"
          check "api health"    "curl -fsS https://api.nyrgo.fun/health"
          check "api nft"       "curl -fsS https://api.nyrgo.fun/v1/nft"
          check "api dex"       "curl -fsS https://api.nyrgo.fun/v1/dex | jq -c '{version, creatures: (.creatures | length)}'"
          check "tiles service" "curl -fsS -o /dev/null -w '%{http_code}' https://tiles.nyrgo.fun/planet/0/0/0.mvt | grep -E '200|204'"
          check "api rewards"   "curl -fsS https://api.nyrgo.fun/v1/rewards | jq -c '{enabled, treasury, today}'"
          check "api market"    "curl -fsS https://api.nyrgo.fun/v1/market | jq -c '{treasury, marketFeeBps, royaltyBps, listings: (.listings | length)}'"
          check "api events"    "curl -fsS 'https://api.nyrgo.fun/v1/events?lat=37.8847&lng=-4.7792' | jq -c '{events: (.events | length)}'"
          check "api duels"     "curl -sS -o /dev/null -w '%{http_code}' https://api.nyrgo.fun/v1/duels | grep -x 401"
          check "api avatar"    "curl -sS -o /dev/null -w '%{http_code}' https://api.nyrgo.fun/v1/me/avatar | grep -x 401"
          check "api hub"       "curl -sS -o /dev/null -w '%{http_code}' https://api.nyrgo.fun/v1/hub/me | grep -x 401"
          check "api hub ws"    "curl -sS -o /dev/null -w '%{http_code}' -H 'Connection: Upgrade' -H 'Upgrade: websocket' -H 'Sec-WebSocket-Version: 13' -H \"Sec-WebSocket-Key: $(head -c 16 /dev/urandom | base64)\" -H 'Origin: https://app.nyrgo.fun' https://api.nyrgo.fun/v1/hub/ws | grep -x 401"
          check "app town art"  "curl -fsS -o /dev/null -w '%{http_code}' https://app.nyrgo.fun/hub/plaza.webp"
          check "api gym"       "curl -sS -o /dev/null -w '%{http_code}' https://api.nyrgo.fun/v1/hub/training | grep -x 401"
          check "api arena"     "curl -sS -o /dev/null -w '%{http_code}' https://api.nyrgo.fun/v1/hub/arena | grep -x 401"
          check "app gym art"   "curl -fsS -o /dev/null -w '%{http_code}' https://app.nyrgo.fun/hub/room-gym.webp"
          check "api market"    "curl -sS -o /dev/null -w '%{http_code}' https://api.nyrgo.fun/v1/hub/market | grep -x 401"
          check "api houses"    "curl -sS -o /dev/null -w '%{http_code}' https://api.nyrgo.fun/v1/hub/houses | grep -x 401"
          check "app furniture" "curl -fsS -o /dev/null -w '%{http_code}' https://app.nyrgo.fun/hub/f-sofa-red.webp"
          check "api leaderboards" "curl -sS -o /dev/null -w '%{http_code}' 'https://api.nyrgo.fun/v1/leaderboards?by=level' | grep -x 401"
          check "api holder"    "curl -sS -o /dev/null -w '%{http_code}' https://api.nyrgo.fun/v1/me/holder | grep -x 401"
          check "api public"    "curl -fsS -o /dev/null -w '%{http_code}' https://api.nyrgo.fun/v1/public/captures"
          check "site globe"    "curl -fsS -o /dev/null -w '%{http_code}' https://nyrgo.fun/globe-data.js"
          check "site demo"     "curl -fsS -o /dev/null -w '%{http_code}' https://nyrgo.fun/assets/media/battle.mp4"
          check "site ja"       "curl -fsS -o /dev/null -w '%{http_code}' https://nyrgo.fun/ja/"
          check "site flags"    "curl -fsS -o /dev/null -w '%{http_code}' https://nyrgo.fun/assets/flags/sa.webp"
          check "app flags"     "curl -fsS -o /dev/null -w '%{http_code}' https://app.nyrgo.fun/flags/jp.webp"
          check "api quests"    "curl -sS -o /dev/null -w '%{http_code}' https://api.nyrgo.fun/v1/hub/quests | grep -x 401"
          check "api tournament" "curl -sS -o /dev/null -w '%{http_code}' https://api.nyrgo.fun/v1/hub/tournament | grep -x 401"
          check "api cors"      "curl -fsS -o /dev/null -D - -X OPTIONS https://api.nyrgo.fun/v1/me -H 'Origin: https://app.nyrgo.fun' -H 'Access-Control-Request-Method: PUT' | grep -i '^access-control-allow-origin'"
          check "api render"    "curl -fsS https://nyrgo-api.onrender.com/health"
          exit $fail
