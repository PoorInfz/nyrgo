name: World map upload (Protomaps → R2)

# Run by hand: copies the latest Protomaps daily basemap of the whole planet (OpenStreetMap data,
# ODbL; ~110 GB) into the R2 bucket nyrgo-tiles as planet.pmtiles, streaming it (nothing is
# stored on the runner). The tiles Worker (apps/tiles) serves it at tiles.nyrgo.fun. Run again
# to refresh the map. Needs the secrets R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (an R2 API token
# with Object Read & Write on nyrgo-tiles) and CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_dispatch:
    inputs:
      build:
        description: Protomaps build date (YYYYMMDD); empty for the latest
        default: ''

permissions:
  contents: read

concurrency:
  group: world-map
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Copy the planet into R2
        shell: bash
        env:
          BUILD: ${{ inputs.build }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
        run: |
          if [ -z "$RCLONE_CONFIG_R2_ACCESS_KEY_ID" ] || [ -z "$RCLONE_CONFIG_R2_SECRET_ACCESS_KEY" ]; then
            echo "::error title=World map::Add the secrets R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY"; exit 1
          fi
          if [ -z "$BUILD" ]; then
            for d in $(seq 0 10); do
              day=$(date -u -d "-$d day" +%Y%m%d)
              if curl -sfI "https://build.protomaps.com/$day.pmtiles" > /dev/null; then BUILD=$day; break; fi
            done
          fi
          [[ "$BUILD" =~ ^[0-9]{8}$ ]] || { echo "::error title=World map::no Protomaps build found"; exit 1; }
          src="https://build.protomaps.com/$BUILD.pmtiles"
          size=$(curl -sfI "$src" | tr -d '\r' | awk 'tolower($1)=="content-length:"{print $2}')
          echo "::notice title=World map::Protomaps build $BUILD, $((size / 1000000000)) GB"
          # streamed in 256 MB parts (R2 allows 10,000 parts: up to 2.5 TB)
          rclone copyurl "$src" r2:nyrgo-tiles/planet.pmtiles \
            --s3-chunk-size 256M --s3-upload-concurrency 8 --stats 60s --stats-one-line -v
          got=$(rclone size r2:nyrgo-tiles/planet.pmtiles --json | jq .bytes)
          if [ "$got" != "$size" ]; then
            echo "::error title=World map::uploaded $got bytes, expected $size"; exit 1
          fi
          echo "::notice title=World map::planet.pmtiles in R2: $got bytes (build $BUILD)"
