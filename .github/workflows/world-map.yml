name: World map upload (Protomaps → R2)

# Run by hand: copies the latest Protomaps daily basemap of the whole planet (OpenStreetMap data,
# ODbL; ~140 GB) into the R2 bucket nyrgo-tiles as planet.pmtiles, in 256 MB parts each fetched
# and uploaded with retries (nothing is stored on the runner). The tiles Worker (apps/tiles)
# serves it at tiles.nyrgo.fun. Run again to refresh the map. Needs the secrets R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (an R2 API token
# with Object Read & Write on nyrgo-tiles) and CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_dispatch:
    inputs:
      build:
        description: Protomaps build date (YYYYMMDD); empty for the latest
        default: ''

permissions:
  contents: read

concurrency:
  group: world-map
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @nyrgo/tiles

      - name: Copy the planet into R2
        shell: bash
        working-directory: apps/tiles
        env:
          BUILD: ${{ inputs.build }}
          BUCKET: nyrgo-tiles
          KEY: planet.pmtiles
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "::error title=World map::Add the secrets R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY"; exit 1
          fi
          if [ -z "$BUILD" ]; then
            for d in $(seq 0 10); do
              day=$(date -u -d "-$d day" +%Y%m%d)
              if curl -sfI "https://build.protomaps.com/$day.pmtiles" > /dev/null; then BUILD=$day; break; fi
            done
          fi
          [[ "$BUILD" =~ ^[0-9]{8}$ ]] || { echo "::error title=World map::no Protomaps build found"; exit 1; }
          echo "::notice title=World map::Protomaps build $BUILD"
          # part by part, each with its own retries: a dropped connection repeats one part only
          if ! SRC="https://build.protomaps.com/$BUILD.pmtiles" node scripts/upload-planet.mjs 2>&1 | tee upload.log; then
            tail -3 upload.log | while read -r l; do echo "::error title=World map::${l:0:400}"; done
            exit 1
          fi
