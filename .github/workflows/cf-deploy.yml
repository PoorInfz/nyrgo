name: Deploy to Cloudflare

# Run by hand: builds and deploys the game app (app.nyrgo.fun), the website (nyrgo.fun) or the
# street map service (tiles.nyrgo.fun) as
# Cloudflare Workers. Needs the repository secrets CLOUDFLARE_API_TOKEN (template "Edit Cloudflare
# Workers") and CLOUDFLARE_ACCOUNT_ID. Pushes to main also deploy through Cloudflare's own builds.

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [app, site, tiles]
        default: app

permissions:
  contents: read

concurrency:
  group: cf-deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Cloudflare::Add the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID"; exit 1
          fi
          case "$TARGET" in
            app) pnpm --filter "@nyrgo/web..." build; cfg=apps/web/wrangler.jsonc ;;
            site) pnpm --filter "@nyrgo/site..." build; cfg=apps/site/wrangler.jsonc ;;
            tiles) cfg=apps/tiles/wrangler.jsonc ;; # wrangler bundles it
          esac
          if npx --yes wrangler@4 deploy --config "$cfg" > deploy.log 2>&1; then status=notice; else status=error; fi
          cat deploy.log
          # the outcome as annotations, readable without the log
          grep -vE '^\s*$|telemetry|─' deploy.log | tail -8 | while read -r l; do
            echo "::$status title=Cloudflare $TARGET::${l:0:400}"
          done
          [ "$status" = notice ]
