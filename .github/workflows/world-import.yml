name: Import world (OpenStreetMap → production)

# Run by hand: loads Córdoba's places and exclusion zones from OpenStreetMap into the production
# database. Safe to run again (the import replaces the area it covers). Needs the repository
# secret PROD_DATABASE_URL (Neon's direct connection string). Data © OpenStreetMap contributors.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only fetch and classify, do not write to the database
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: world-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @nyrgo/shared build

      - name: Import
        working-directory: apps/api
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          flags=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then flags="--dry-run"
          elif [ -z "$DATABASE_URL" ]; then
            echo "::error title=World import::The repository secret PROD_DATABASE_URL is missing"; exit 1
          fi
          # the public Overpass servers are often busy: try the main one, then mirrors
          ok=0
          for url in https://overpass-api.de/api/interpreter \
                     https://overpass.kumi.systems/api/interpreter \
                     https://overpass.private.coffee/api/interpreter; do
            if OVERPASS_URL=$url pnpm world:import $flags > import.log 2>&1; then ok=1; break; fi
            echo "::warning title=World import::$url failed, trying the next server"
            sleep 20
          done
          if [ $ok = 0 ]; then
            cat import.log
            # the error (never the connection string: it is masked as a secret)
            grep -iE 'error|refused|denied|timeout|ENOTFOUND|ssl' import.log | head -3 | while read -r l; do
              echo "::error title=World import::${l:0:400}"
            done
            exit 1
          fi
          cat import.log
          # the summary as annotations, readable without the log
          grep -E '^(elements|POIs|exclusion|loaded)' import.log | while read -r l; do
            echo "::notice title=World import::${l:0:500}"
          done
