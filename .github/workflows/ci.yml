name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgres://nyrgo:nyrgo@127.0.0.1:5432/nyrgo_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL + PostGIS + h3 (same image as local development)
        run: |
          docker build -t nyrgo-db:17 infra/db
          docker run -d --name db -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=nyrgo -e POSTGRES_PASSWORD=nyrgo -e POSTGRES_DB=nyrgo_test \
            nyrgo-db:17
          for i in $(seq 1 30); do docker exec db pg_isready -U nyrgo -d nyrgo_test && break; sleep 2; done

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build shared package
        run: pnpm --filter @nyrgo/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrations up, down, up
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          pnpm db:migrate
          pnpm db:rollback
          pnpm db:migrate

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level high

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contract:
    name: NFT contract (test and build wasm)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts/creatures
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/creatures

      - name: Unit tests
        run: cargo test

      # cargo-near sets the wasm flags the NEAR runtime accepts and runs wasm-opt
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh

      - name: Build the contract
        run: cargo near build non-reproducible-wasm

      - uses: actions/upload-artifact@v4
        with:
          name: nyrgo-creatures-wasm
          path: contracts/creatures/target/near/*.wasm

  api-image:
    name: API image (build and boot)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f apps/api/Dockerfile -t nyrgo-api .

      - name: Boot it against an empty database, as in production
        run: |
          docker network create net
          docker build -t nyrgo-db:17 infra/db
          docker run -d --name db --network net -e POSTGRES_USER=nyrgo -e POSTGRES_PASSWORD=nyrgo \
            -e POSTGRES_DB=nyrgo nyrgo-db:17
          for i in $(seq 1 30); do docker exec db pg_isready -U nyrgo -d nyrgo && break; sleep 2; done
          docker run -d --name api --network net -p 8080:8080 \
            -e DATABASE_URL=postgres://nyrgo:nyrgo@db:5432/nyrgo \
            -e APP_URL=https://app.nyrgo.test -e PUBLIC_API_URL=https://api.nyrgo.test \
            -e MAIL_DRIVER=resend -e RESEND_API_KEY=re_ci_not_a_real_key -e 'MAIL_FROM=nyrGo! <hola@nyrgo.test>' \
            -e SPAWN_SECRET="$(openssl rand -hex 32)" \
            nyrgo-api
          for i in $(seq 1 30); do curl -fsS localhost:8080/health && break; sleep 2; done
          curl -fsS localhost:8080/v1/dex > /dev/null
          docker logs api 2>&1 | tail -20
          curl -fsS localhost:8080/health

  android:
    name: Android app (debug build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the web app and copy it into the Android project
        working-directory: apps/mobile
        run: pnpm sync

      - name: Build the APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: nyrgo-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
