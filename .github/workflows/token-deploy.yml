name: Deploy token (testnet)

# Run by hand from the Actions tab. Creates token.<game account> and deploys the NYRGO token with
# its whole fixed supply in the game account. Safe to run again: it only does what is missing.
# Needs the repository secret NEAR_TESTNET_GAME_KEY (the game account's ed25519 secret key).

on:
  workflow_dispatch:
    inputs:
      game_account:
        description: Game account on testnet (it mints and owns the contract)
        required: true
        default: nyrgo.testnet
      dry_run:
        description: Only look and report, change nothing
        type: boolean
        default: true
      upgrade:
        description: Replace the token code if it differs (balances are kept)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: token-deploy-testnet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: testnet
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/token

      - name: Contract tests
        working-directory: contracts/token
        run: cargo test

      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh

      - name: Build the contract
        working-directory: contracts/token
        run: cargo near build non-reproducible-wasm

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @nyrgo/shared build

      - name: Deploy
        working-directory: apps/api
        env:
          NEAR_GAME_ACCOUNT: ${{ inputs.game_account }}
          NEAR_GAME_KEY: ${{ secrets.NEAR_TESTNET_GAME_KEY }}
        run: |
          flags=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then flags="$flags --dry-run"; fi
          if [ "${{ inputs.upgrade }}" = "true" ]; then flags="$flags --upgrade"; fi
          pnpm token:deploy --wasm ../../contracts/token/target/near/nyrgo_token.wasm $flags
